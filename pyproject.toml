[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[project]
name = "xtra-takehome"
version = "0.3.0"
description = "4-Xtra Senior DS/MLE take-home: Brent tail diagnostics, GJR-skew-t scenario generation, horizon-matched validation, robustness, and reporting"
requires-python = ">=3.11"
dependencies = [
  "arch==7.2.0",
  "matplotlib==3.10.3",
  "numpy==2.2.6",
  "pandas==2.2.3",
  "scipy==1.15.3",
  "statsmodels==0.14.4",
  "yfinance==0.2.61",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.5",
]
# The interactive lab. Kept out of the default install so the clean-clone
# contract in run.sh / run.ps1 stays exactly as it was.
app = [
  "streamlit==1.41.1",
  "plotly==5.24.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
