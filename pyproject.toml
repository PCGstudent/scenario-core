[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[project]
name = "xtra-takehome"
version = "0.3.0"
description = "4-Xtra Senior DS/MLE take-home: Brent tail diagnostics, GJR-skew-t scenario generation, horizon-matched validation, robustness, and reporting"
requires-python = ">=3.11"
dependencies = [
  "arch==7.2.0",
  "matplotlib==3.10.3",
  "numpy==2.2.6",
  "pandas==2.2.3",
  "scipy==1.15.3",
  "statsmodels==0.14.4",
  "yfinance==0.2.61",
]

[project.optional-dependencies]
dev = [
  # 9.0.3 fixes PYSEC-2026-1845 / CVE-2025-71176 (a local tmp-directory naming
  # issue on Unix). Pytest is test tooling, not part of the scientific
  # dependency stack above, so this pin has no effect on the fetched data, the
  # fitted model, or any committed report -- run.sh/run.ps1's clean-clone
  # command installs this extra, so it must carry the fixed version too.
  "pytest==9.0.3",
]
# The interactive lab. Kept out of the default install so the clean-clone
# contract in run.sh / run.ps1 stays exactly as it was.
app = [
  "streamlit==1.41.1",
  "plotly==5.24.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
markers = [
  "invariants: directly enforces a numbered statistical invariant in AGENTS.md",
  "negative_controls: proves a gate/check rejects a generator lacking the property it claims to test (AGENTS.md invariant 14)",
]

[tool.ruff]
target-version = "py313"
line-length = 92
# Phase 0 scope: lint and format-check new platform code and newly added
# tests. The existing quantitative core, the Streamlit lab, and the
# pre-existing test files are EXCLUDED entirely -- from lint and from format
# -- rather than bulk-reformatted to satisfy a new tool. AGENTS.md forbids
# refactoring the statistical implementation for style, and "Ruff format
# --check passes for the intended scope" (Phase 0 acceptance criteria) means
# this scope, not the whole repository.
#
# Consequence: Ruff's TID251 banned-import rule below therefore does not scan
# src/xtra_takehome for boto3/botocore either. That is intentional, not an
# oversight -- the architecture plan's own Phase 0 brief allows it explicitly
# ("if Ruff cannot express every rule safely, enforce the remainder through
# tests"), and tests/test_no_aws_in_core.py is the primary, always-active
# enforcement for the core via AST inspection, independent of lint scope. Once
# src/scenario_platform/domain exists (Phase 1) it is linted normally and
# carries the same guard test.
extend-exclude = [
  "src/xtra_takehome",
  "app.py",
  # ruff format's default file selection also formats fenced Python code
  # blocks inside Markdown; this repo's docs (including the architecture
  # plan) and generated reports must never be touched by it.
  "*.md",
  "tests/test_app_risk.py",
  "tests/test_app_stress.py",
  "tests/test_challenger.py",
  "tests/test_data.py",
  "tests/test_diagnostics.py",
  "tests/test_end_to_end.py",
  "tests/test_metrics.py",
  "tests/test_model.py",
  "tests/test_report.py",
  "tests/test_robustness.py",
  "tests/test_validation.py",
  "tests/test_windows.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "TID251"]

# Architectural boundary (architecture plan Section 7.3 / AGENTS.md invariant 28):
# no boto3/botocore import, in any file this configuration actually lints.
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"boto3".msg = "AWS SDK is forbidden in the quantitative core and domain layer (AGENTS.md invariant 28)."
"botocore".msg = "AWS SDK is forbidden in the quantitative core and domain layer (AGENTS.md invariant 28)."

# Phase 3b's two named exceptions to the ban above -- the architecture plan's
# own repository-structure section calls scenario_platform.adapters "the ONLY
# place boto3 appears in the data plane"; scenario_platform.control is the
# thin control-plane Lambda layer, a different plane, and boto3 there (never
# in scenario_platform.domain or scenario_platform.worker, both still banned
# above and both still guarded independently by tests/test_no_aws_in_core.py)
# is the expected, reviewed shape, not a boundary erosion.
[tool.ruff.lint.per-file-ignores]
"src/scenario_platform/adapters/s3_store.py" = ["TID251"]
"src/scenario_platform/adapters/job_store.py" = ["TID251"]
"src/scenario_platform/control/*.py" = ["TID251"]
# Phase 3b test files that set up moto-mocked AWS resources directly
# (fixtures, assertions against S3/DynamoDB state) -- boto3 here is test
# scaffolding, not a boundary the tests are meant to enforce.
"tests/scenario_platform/conftest.py" = ["TID251"]
"tests/scenario_platform/test_control_jobs.py" = ["TID251"]
"tests/scenario_platform/test_control_submit.py" = ["TID251"]
"tests/scenario_platform/test_control_admission.py" = ["TID251"]
"tests/scenario_platform/test_worker_job_id_mode.py" = ["TID251"]
"tests/scenario_platform/test_s3_store.py" = ["TID251"]
"tests/infra/test_demo_killswitch_cleanup.py" = ["TID251"]
# Operator scripts run once, manually, with direct human credentials --
# never imported by application code, never run by CI (scripts/seed_registry.py's
# own docstring; the same posture as scripts/build_artifact.py).
"scripts/seed_registry.py" = ["TID251"]
"scripts/smoke.py" = ["TID251"]

[tool.mypy]
python_version = "3.13"
# src/scenario_platform is an empty placeholder package in Phase 0 (see its
# __init__.py) -- this section establishes the strict-typing rule now so
# Phase 1's domain layer is typed from its first commit rather than
# retrofitted later. There is intentionally nothing to check yet. The
# existing research package (src/xtra_takehome) is explicitly out of scope
# for Phase 0 -- see the Ruff note above for the same reasoning.
files = ["src/scenario_platform"]
strict = true
warn_unused_configs = true
disallow_untyped_defs = true

# pandas 2.2.3 (the pinned scientific-stack version, [project.dependencies])
# ships without inline type information mypy strict mode accepts, and adding
# `pandas-stubs` would be a new dev dependency purely for this. The domain
# layer's own use of pandas is limited to one parameter type
# (`pd.Series` in fit()/validate()'s signatures) and the values inside it are
# converted to plain numpy immediately -- so ignoring pandas' own missing
# stubs costs no real type-safety here, unlike ignoring xtra_takehome's own
# code would.
[[tool.mypy.overrides]]
module = "pandas.*"
ignore_missing_imports = true

# threadpoolctl ships no py.typed marker either; the worker's own use of it
# is a single call (threadpool_info()) whose result is immediately typed
# explicitly at the call site (see worker/__main__.py), so ignoring its
# missing stubs costs no real type-safety here either.
[[tool.mypy.overrides]]
module = "threadpoolctl.*"
ignore_missing_imports = true

# boto3/botocore ship no py.typed marker (boto3-stubs/botocore-stubs are a
# separate, large, generated third-party package this Phase 3b slice does
# not otherwise need). Every boto3 call result this module set actually
# relies on the shape of is cast explicitly at the call site
# (scenario_platform.adapters.{job_store,s3_store}), so ignoring the
# missing stubs here costs no real type-safety, the same reasoning as the
# pandas/threadpoolctl overrides above.
[[tool.mypy.overrides]]
module = ["boto3.*", "botocore.*"]
ignore_missing_imports = true
