# Every `Resource: "*"` (or `Resource: "arn:...:key/*"` KMS key-policy
# convention) granted in an IAM identity policy anywhere under
# infra/terraform, enumerated with the role it applies to and a
# justification a reviewer can check against the AWS service-authorization
# reference. IMPLEMENTATION_PLAN.md Section 17: "adding an entry is a
# reviewed diff, not a silent change." Cross-checked structurally by
# tests/test_terraform_policy.py -- an IAM identity-policy Allow statement
# with resources == ["*"] whose sid is not listed here fails that test.
#
# Resource-BASED policies (S3 bucket policies, KMS key policies, ECR
# repository policies, VPC endpoint policies) are a different category:
# there the policy scopes access by resource ownership, principal and
# condition rather than by an identity's own grant, and a key policy's
# "Resource: *" is AWS's own documented convention for "this key" (a key
# cannot name its own ARN in its own policy). Section 13.1's wildcard rule
# is about identity-policy escalation surface; resource policies are
# listed here too, for completeness and the same reviewability, in their
# own section below, but are not subject to the same test.

runtime:
  # Section 13.1's enumerated runtime exception, restated per attaching
  # role. "runtime" means: a role assumed by application compute, never a
  # deployment/CI identity.
  - role: "runtime roles (via the project permissions boundary, modules/ci_oidc)"
    action: "ecr:GetAuthorizationToken"
    sid: "EcrAuthToken"
    file: "infra/terraform/modules/ci_oidc/main.tf"
    justification: >
      No resource-level support (AWS service-authorization reference).
      Returns only a token for the caller's own account; every subsequent
      pull action in the same boundary statement is resource-scoped to
      the project ECR repository prefix.

deployment:
  # Section 13.1 point 5: deployment roles are reviewed separately, and
  # this list is broader by design -- infrastructure creation legitimately
  # needs a wider surface than any runtime identity.
  - role: "gha-ci-dev"
    action: "kms:CreateKey"
    sid: "KmsCreateKey"
    file: "infra/terraform/modules/ci_oidc/policy.tf"
    justification: >
      kms:CreateKey does not support resource-level permissions -- the key
      ARN does not exist until the call returns. Every subsequent
      key-management action in the same policy is scoped to
      arn:aws:kms:{region}:{account}:key/* (any key in this account, not
      account-wide across services).

  - role: "gha-ci-dev"
    action: "ecr:GetAuthorizationToken"
    sid: "EcrAuthToken"
    file: "infra/terraform/modules/ci_oidc/policy.tf"
    justification: >
      Same AWS limitation as the runtime entry above. The push actions in
      the same policy (InitiateLayerUpload, UploadLayerPart, PutImage,
      etc.) are scoped to the one worker ECR repository ARN.

  - role: "gha-ci-dev"
    action: "ec2:DescribeVpcs, ec2:DescribeVpcAttribute, ec2:DescribeSubnets, ec2:DescribeRouteTables, ec2:DescribeSecurityGroups, ec2:DescribeVpcEndpoints, ec2:DescribeAvailabilityZones, ec2:DescribePrefixLists, ec2:DescribeFlowLogs, ec2:DescribeTags"
    sid: "Ec2DescribeOnly"
    file: "infra/terraform/modules/ci_oidc/policy.tf"
    justification: >
      Corrected from an earlier, inaccurate blanket claim that EC2's
      VPC-family Create actions also lack resource-level support --
      verified directly against the AWS Service Authorization Reference
      and AWS's own tag-based-access-control guidance, EC2 Create/Modify
      actions in this family (CreateVpc, CreateSubnet, CreateSecurityGroup,
      etc.) DO have documented resource types and DO support
      resource-level ARN scoping (see the "Ec2ResourceScopedManagement"
      statement, no longer Resource="*" and therefore not listed here).
      Only the pure Describe*/List* actions above -- which read across an
      unbounded resource set rather than acting on one identified
      resource -- genuinely lack resource-level support, the same as in
      most AWS services. Deliberately excludes
      ec2:CreateInternetGateway, ec2:AttachInternetGateway,
      ec2:CreateNatGateway and ec2:AllocateAddress -- their absence is a
      second, independent enforcement layer behind the
      no-NAT-gateway/no-internet-gateway Terraform policy check.

  - role: "gha-ci-dev"
    action: "ecs:RegisterTaskDefinition, ecs:DeregisterTaskDefinition, ecs:DescribeTaskDefinition, ecs:ListTaskDefinitions"
    sid: "EcsTaskDefinitionRegistration"
    file: "infra/terraform/modules/ci_oidc/policy.tf"
    justification: >
      Verified directly against AWS's ECS IAM documentation and a
      tracked, still-open containers-roadmap feature request
      (aws/containers-roadmap#929, "Resource-level permissions for Task
      Definitions"): task-definition actions have no resource-level
      permission support at all today, an AWS-documented limitation
      distinct from -- and narrower than -- the EC2 correction above.
      Cluster-level ECS actions (CreateCluster, DeleteCluster,
      DescribeClusters, tagging) ARE resource-scoped to the cluster and
      task-definition-family ARN pattern (see
      "EcsClusterManagement", not Resource="*" and therefore not listed
      here).

resource_based_policies:
  # Listed for completeness/reviewability; not IAM identity grants, so not
  # checked by the identity-policy allowlist test above.
  - resource: "aws_kms_key (bootstrap CMK, modules/kms environment CMK)"
    sid: "AccountRootAdmin"
    justification: >
      The standard, AWS-documented "enable IAM user permissions" key-policy
      statement every CMK needs so the key can never become unmanageable.
      Scoped to the account root principal only; grants nothing to any
      other principal. "Resource: *" in a KMS key policy is AWS's own
      convention meaning "this key" -- a key cannot name its own ARN in
      its own policy.

  - resource: "aws_kms_key (modules/kms environment CMK)"
    sid: "KeyAdministrators / KeyUsers / AllowCloudWatchLogs"
    justification: >
      Same "Resource: * means this key" KMS key-policy convention.
      Principals are scoped to the named var.key_administrators/
      var.key_users lists (empty in Phase 3a) and, for CloudWatch Logs,
      the regional logs.{region}.amazonaws.com service principal
      constrained by an aws:logs:arn encryption-context condition.

  - resource: "aws_vpc_endpoint (network module: s3 gateway endpoint)"
    sid: "AllowEcrLayerBucketReadOnly"
    justification: >
      Verified directly against AWS's official ECR VPC-endpoints
      documentation ("Minimum Amazon S3 Bucket Permissions for Amazon
      ECR"): ECR stores every image layer in its own AWS-managed S3
      bucket outside this account
      (arn:aws:s3:::prod-{region}-starport-layer-bucket/*), and layer
      downloads flow over the project's own S3 gateway endpoint.
      s3:GetObject on that exact ARN pattern is the complete documented
      requirement -- no broader action, and no other third-party or
      cross-account bucket is reachable through this endpoint policy.

  - resource: "aws_vpc_endpoint (network module: ecr.api, ecr.dkr, logs)"
    sid: "AllowAuth / AllowThisRepositoryOnly / AllowThisAccountOnly"
    justification: >
      VPC endpoint policies gate which requests are deliverable over that
      one network path at all; they grant nothing by themselves (IAM
      still applies on top). ecr:GetAuthorizationToken has no resource-level
      support (same limitation as above); the logs endpoint has no
      specific log-group ARN to name yet (Phase 3b creates the first log
      group) so it is scoped instead to this account's own principals via
      aws:PrincipalAccount.
