# Every `Resource: "*"` (or `Resource: "arn:...:key/*"` KMS key-policy
# convention) granted in an IAM identity policy anywhere under
# infra/terraform, enumerated with the role it applies to and a
# justification a reviewer can check against the AWS service-authorization
# reference. IMPLEMENTATION_PLAN.md Section 17: "adding an entry is a
# reviewed diff, not a silent change." Cross-checked structurally by
# tests/test_terraform_policy.py -- an IAM identity-policy Allow statement
# with resources == ["*"] whose sid is not listed here fails that test.
#
# Resource-BASED policies (S3 bucket policies, KMS key policies, ECR
# repository policies, VPC endpoint policies) are a different category:
# there the policy scopes access by resource ownership, principal and
# condition rather than by an identity's own grant, and a key policy's
# "Resource: *" is AWS's own documented convention for "this key" (a key
# cannot name its own ARN in its own policy). Section 13.1's wildcard rule
# is about identity-policy escalation surface; resource policies are
# listed here too, for completeness and the same reviewability, in their
# own section below, but are not subject to the same test.

runtime:
  - role: "runtime roles via permissions boundary"
    action: "ec2:DescribeVpcEndpoints"
    sid: "BoundaryCleanupEndpointDescribe"
    file: "infra/terraform/modules/ci_oidc/main.tf"
    justification: >
      DescribeVpcEndpoints has no resource-level IAM support. This boundary
      entry is only a ceiling for the cleanup role's identical read action;
      endpoint deletion is separately ARN- and project-Name-tag-scoped.
  - role: "runtime roles via permissions boundary"
    action: "logs:DescribeLogGroups"
    sid: "BoundaryDescribeLogGroups"
    file: "infra/terraform/modules/ci_oidc/main.tf"
    justification: >
      This action has no resource type and is kept separate, matching
      SfnLogGroupDescribe. https://docs.aws.amazon.com/service-authorization/latest/reference/list_amazoncloudwatchlogs.html
  - role: "runtime roles via permissions boundary"
    action: "logs:CreateLogDelivery, logs:GetLogDelivery, logs:UpdateLogDelivery, logs:DeleteLogDelivery, logs:ListLogDeliveries, logs:PutResourcePolicy, logs:DescribeResourcePolicies"
    sid: "BoundaryLogDelivery"
    file: "infra/terraform/modules/ci_oidc/main.tf"
    justification: >
      Ceiling for the same unscopable log-delivery actions already granted to
      the SFN role. Without this boundary allowance its identity grant is denied.
      https://docs.aws.amazon.com/step-functions/latest/dg/cw-logs.html
  # Section 13.1's enumerated runtime exception, restated per attaching
  # role. "runtime" means: a role assumed by application compute, never a
  # deployment/CI identity.
  - role: "runtime roles (via the project permissions boundary, modules/ci_oidc)"
    action: "ecr:GetAuthorizationToken"
    sid: "EcrAuthToken"
    file: "infra/terraform/modules/ci_oidc/main.tf"
    justification: >
      No resource-level support (AWS service-authorization reference).
      Returns only a token for the caller's own account; every subsequent
      pull action in the same boundary statement is resource-scoped to
      the project ECR repository prefix.

  - role: "4xtra-{env}-sfn-orchestrator (modules/job_orchestrator)"
    action: "logs:CreateLogDelivery, logs:GetLogDelivery, logs:UpdateLogDelivery, logs:DeleteLogDelivery, logs:ListLogDeliveries, logs:PutResourcePolicy, logs:DescribeResourcePolicies"
    sid: "StateMachineLogDelivery"
    file: "infra/terraform/modules/job_orchestrator/main.tf"
    justification: >
      The exact cross-account log-delivery API family AWS's own Step
      Functions execution-history-logging setup documentation requires
      (CreateLogDelivery et al.) -- none of these actions support
      resource-level permissions in the AWS Service Authorization
      Reference for CloudWatch Logs (list_logs.html); they manage the
      log-delivery configuration object itself, not a named log group.

  - role: "4xtra-{env}-sfn-orchestrator (modules/job_orchestrator)"
    action: "logs:DescribeLogGroups"
    sid: "SfnLogGroupDescribe"
    file: "infra/terraform/modules/job_orchestrator/main.tf"
    justification: >
      Same verified limitation as modules/ci_oidc's own
      "ProbeLogGroupDescribe" entry below: DescribeLogGroups' own row in
      list_logs.html lists no resource type at all, and is kept isolated
      in its own statement rather than bundled with a resource-scoped
      action.

  - role: "4xtra-{env}-sfn-orchestrator (modules/job_orchestrator)"
    action: "ecs:DescribeTasks"
    sid: "DescribeOwnClusterTasks"
    file: "infra/terraform/modules/job_orchestrator/main.tf"
    justification: >
      Called by ClassifyFailure (Section 6.3) against a task ARN this
      role only learns at runtime from the RunTask/Catch response, so it
      cannot be named in the policy when authored -- scoped instead by
      the ecs:cluster condition to this environment's one worker cluster,
      the same pattern Section 13.1 already documents for this role's
      RunTask/StopTask/PassRole grants (task and execution ARNs unknown
      ahead of time; the condition is the scoping mechanism).

  - role: "4xtra-{env}-sfn-orchestrator (modules/job_orchestrator)"
    action: "ecs:StopTask, ecs:DescribeTasks"
    sid: "ManageOwnTasks"
    file: "infra/terraform/modules/job_orchestrator/main.tf"
    justification: >
      Section 13.1's own row for this role: "ecs:StopTask,
      ecs:DescribeTasks" -- StopTask backs the DELETE /scenario-jobs
      cancellation path (Section 6.1 step 7). Same runtime-unknown-task-ARN
      reasoning as "DescribeOwnClusterTasks" immediately above; scoped by
      the ecs:cluster condition, not by task ARN.

  - role: "4xtra-{env}-demo-cleanup (modules/demo_killswitch)"
    action: "ecs:ListTasks, ecs:StopTask, ecs:DescribeTasks"
    sid: "StopAndConfirmTasksInDemoClustersOnly"
    file: "infra/terraform/modules/demo_killswitch/main.tf"
    justification: >
      ecs:ListTasks reads across an entire cluster by construction (it
      enumerates task ARNs, it does not act on one already-identified
      task) and has no resource type to scope to before the call returns.
      ecs:StopTask's target task ARN is discovered from that same
      ListTasks call at invocation time, not known when this policy is
      authored. ecs:DescribeTasks is what the `tasks_stopped` waiter
      (lambda/cleanup.py) polls to confirm a stop actually completed,
      rather than trusting StopTask's own acceptance of the request.
      All three are scoped instead by the ecs:cluster condition to
      exactly the demo cluster ARN(s) this module is told to watch
      (var.ecs_cluster_arns) -- the same runtime-unknown-resource pattern
      already documented for modules/job_orchestrator's identical actions
      above.

  - role: "4xtra-{env}-demo-cleanup (modules/demo_killswitch)"
    action: "ecs:DescribeTaskDefinition"
    sid: "DescribeWatchedTaskDefinitions"
    file: "infra/terraform/modules/demo_killswitch/main.tf"
    justification: >
      Same verified limitation as modules/ci_oidc's own
      "EcsTaskDefinitionReadOnlyAndDeregister" entry below:
      DescribeTaskDefinition's own row in list_ecs.html lists no resource
      type at all. Used to confirm a deregistration actually took effect
      (verification, not assumption) before this module reports it as
      done.

  - role: "4xtra-{env}-demo-cleanup (modules/demo_killswitch)"
    action: "ecs:DeregisterTaskDefinition"
    sid: "DeregisterTaskDefinitions"
    file: "infra/terraform/modules/demo_killswitch/main.tf"
    justification: >
      Same verified limitation as modules/ci_oidc's own
      "EcsTaskDefinitionReadOnlyAndDeregister" entry below: this action's
      own row in list_ecs.html lists no resource type at all, so IAM
      cannot scope WHICH task definition this role may deregister to
      var.task_definition_arns -- an earlier version of this module
      attempted exactly that scoping and was wrong to. The actual
      narrowing lives in the Lambda's own code
      (infra/terraform/modules/demo_killswitch/lambda/cleanup.py only
      ever calls this with the specific ARNs it was configured with),
      not in IAM -- a real, disclosed gap, not a silently broader grant
      than intended.

  - role: "4xtra-{env}-demo-cleanup (modules/demo_killswitch)"
    action: "ec2:DescribeVpcEndpoints"
    sid: "DescribeEndpoints"
    file: "infra/terraform/modules/demo_killswitch/main.tf"
    justification: >
      Same documented limitation as modules/ci_oidc's own
      "Ec2DescribeOnly" entry below: DescribeVpcEndpoints is a pure
      Describe action with no resource-level support, reading across an
      unbounded set of endpoints rather than one identified resource. The
      subsequent ec2:DeleteVpcEndpoints action in the same role's policy
      IS resource-scoped, to exactly the endpoint ARNs this module is
      told to watch (var.vpc_endpoint_ids) -- not listed here because it
      is not Resource="*".

deployment:
  - role: "gha-ci-dev"
    action: "sns:Unsubscribe"
    sid: "SnsSubscriptionDelete"
    file: "infra/terraform/modules/ci_oidc/policy.tf"
    justification: >
      Unsubscribe is authorized against the opaque subscription ARN returned
      only after a subscription exists and is confirmed; AWS SNS does not
      support constraining this action to the project's topic ARN. Topic
      creation, mutation, subscription creation and reads remain scoped to
      arn:aws:sns:{region}:{account}:4xtra-{env}-*.
  # Section 13.1 point 5: deployment roles are reviewed separately, and
  # this list is broader by design -- infrastructure creation legitimately
  # needs a wider surface than any runtime identity.
  - role: "gha-ci-dev"
    action: "kms:CreateKey"
    sid: "KmsCreateKey"
    file: "infra/terraform/modules/ci_oidc/policy.tf"
    justification: >
      kms:CreateKey does not support resource-level permissions -- the key
      ARN does not exist until the call returns. Every subsequent
      key-management action in the same policy is scoped to
      arn:aws:kms:{region}:{account}:key/* (any key in this account, not
      account-wide across services).

  - role: "gha-ci-dev"
    action: "ecr:GetAuthorizationToken"
    sid: "EcrAuthToken"
    file: "infra/terraform/modules/ci_oidc/policy.tf"
    justification: >
      Same AWS limitation as the runtime entry above. The push actions in
      the same policy (InitiateLayerUpload, UploadLayerPart, PutImage,
      etc.) are scoped to the one worker ECR repository ARN.

  - role: "gha-ci-dev"
    action: "ec2:DescribeVpcs, ec2:DescribeVpcAttribute, ec2:DescribeSubnets, ec2:DescribeRouteTables, ec2:DescribeSecurityGroups, ec2:DescribeVpcEndpoints, ec2:DescribeAvailabilityZones, ec2:DescribePrefixLists, ec2:DescribeFlowLogs, ec2:DescribeTags"
    sid: "Ec2DescribeOnly"
    file: "infra/terraform/modules/ci_oidc/policy.tf"
    justification: >
      Corrected from an earlier, inaccurate blanket claim that EC2's
      VPC-family Create actions also lack resource-level support --
      verified directly against the AWS Service Authorization Reference
      and AWS's own tag-based-access-control guidance, EC2 Create/Modify
      actions in this family (CreateVpc, CreateSubnet, CreateSecurityGroup,
      etc.) DO have documented resource types and DO support
      resource-level ARN scoping (see the "Ec2ResourceScopedManagement"
      statement, no longer Resource="*" and therefore not listed here).
      Only the pure Describe*/List* actions above -- which read across an
      unbounded resource set rather than acting on one identified
      resource -- genuinely lack resource-level support, the same as in
      most AWS services. Deliberately excludes
      ec2:CreateInternetGateway, ec2:AttachInternetGateway,
      ec2:CreateNatGateway and ec2:AllocateAddress -- their absence is a
      second, independent enforcement layer behind the
      no-NAT-gateway/no-internet-gateway Terraform policy check.

  - role: "gha-ci-dev"
    action: "ecs:DeregisterTaskDefinition, ecs:DescribeTaskDefinition, ecs:ListTaskDefinitions"
    sid: "EcsTaskDefinitionReadOnlyAndDeregister"
    file: "infra/terraform/modules/ci_oidc/policy.tf"
    justification: >
      Verified individually against the current AWS Service Authorization
      Reference for ECS (list_ecs.html): each of these three actions'
      own row lists no resource type at all (the "Resource types
      (*required)" column is blank), so Resource must be "*". Corrected
      from an earlier revision that bundled ecs:RegisterTaskDefinition
      into this same statement/justification on the strength of a
      containers-roadmap issue describing these three, not that one --
      RegisterTaskDefinition's own row lists "task-definition*"
      (required) and is now separately resource-scoped (see
      "EcsTaskDefinitionRegistration", not Resource="*" and therefore not
      listed here). Cluster-level ECS actions (CreateCluster,
      DeleteCluster, DescribeClusters, tagging) are also resource-scoped
      to the cluster and task-definition-family ARN pattern (see
      "EcsClusterManagement", likewise not listed here).

  - role: "gha-ci-dev"
    action: "logs:DescribeLogGroups"
    sid: "ProbeLogGroupDescribe"
    file: "infra/terraform/modules/ci_oidc/policy.tf"
    justification: >
      Verified directly against the current AWS Service Authorization
      Reference for CloudWatch Logs (list_logs.html): DescribeLogGroups'
      own row lists no resource type at all (the "Resource types
      (*required)" column is blank) -- it reads across every log group in
      the account, not one identified resource. Every other action in
      "ProbeLogGroupManagement" (CreateLogGroup, DeleteLogGroup,
      PutRetentionPolicy, AssociateKmsKey, and both the pre- and
      post-migration tagging action names) individually lists "log-group"
      as a supported resource type and stays scoped to
      arn:aws:logs:{region}:{account}:log-group:/4xtra/* -- not listed
      here because it is not Resource="*".

resource_based_policies:
  # Listed for completeness/reviewability; not IAM identity grants, so not
  # checked by the identity-policy allowlist test above.
  - resource: "aws_kms_key (bootstrap CMK, modules/kms environment CMK)"
    sid: "AccountRootAdmin"
    justification: >
      The standard, AWS-documented "enable IAM user permissions" key-policy
      statement every CMK needs so the key can never become unmanageable.
      Scoped to the account root principal only; grants nothing to any
      other principal. "Resource: *" in a KMS key policy is AWS's own
      convention meaning "this key" -- a key cannot name its own ARN in
      its own policy.

  - resource: "aws_kms_key (modules/kms environment CMK)"
    sid: "KeyAdministrators / KeyUsers / AllowCloudWatchLogs"
    justification: >
      Same "Resource: * means this key" KMS key-policy convention.
      Principals are scoped to the named var.key_administrators/
      var.key_users lists (empty in Phase 3a) and, for CloudWatch Logs,
      the regional logs.{region}.amazonaws.com service principal
      constrained by an aws:logs:arn encryption-context condition.

  - resource: "aws_vpc_endpoint (network module: s3 gateway endpoint)"
    sid: "AllowEcrLayerBucketReadOnly"
    justification: >
      Verified directly against AWS's official ECR VPC-endpoints
      documentation ("Minimum Amazon S3 Bucket Permissions for Amazon
      ECR"): ECR stores every image layer in its own AWS-managed S3
      bucket outside this account
      (arn:aws:s3:::prod-{region}-starport-layer-bucket/*), and layer
      downloads flow over the project's own S3 gateway endpoint.
      s3:GetObject on that exact ARN pattern is the complete documented
      requirement -- no broader action, and no other third-party or
      cross-account bucket is reachable through this endpoint policy.

  - resource: "aws_vpc_endpoint (network module: ecr.api, ecr.dkr, logs)"
    sid: "AllowAuth / AllowThisRepositoryOnly / AllowThisAccountOnly"
    justification: >
      VPC endpoint policies gate which requests are deliverable over that
      one network path at all; they grant nothing by themselves (IAM
      still applies on top). ecr:GetAuthorizationToken has no resource-level
      support (same limitation as above); the logs endpoint has no
      specific log-group ARN to name yet (Phase 3b creates the first log
      group) so it is scoped instead to this account's own principals via
      aws:PrincipalAccount.
