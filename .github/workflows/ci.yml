name: CI

# Phase 0 (docs/architecture/IMPLEMENTATION_PLAN.md): engineering-baseline checks
# only. No Terraform, no container build/scan, no AWS access, no AWS OIDC --
# those arrive in later phases alongside the resources they check.
#
# Every job pins its actions by immutable commit SHA (verified against the
# upstream tag via `git ls-remote` at the time this file was written; the
# trailing comment names the tag that commit currently corresponds to, for
# human readability only -- the SHA, not the comment, is what runs).

on:
  push:
    branches: [main]
  pull_request:

# Cancel a superseded run on the same ref so PR pushes don't queue stale CI.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege at the workflow level; every job reads the checkout and
# nothing else. No job needs to write to the repository, comment on a PR,
# or touch any cloud credential.
permissions:
  contents: read

env:
  PYTHON_VERSION: "3.13"

jobs:
  lint-and-format:
    name: Lint and format (Ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dev tools from the locked, hash-verified set
        run: pip install --require-hashes -r requirements/dev.lock
      - name: Ruff check (new platform code + newly added tests only -- see pyproject.toml)
        run: ruff check .
      - name: Ruff format --check (same scope)
        run: ruff format --check .

  typecheck:
    name: Type check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dev tools from the locked, hash-verified set
        run: pip install --require-hashes -r requirements/dev.lock
      - name: mypy (src/scenario_platform only -- see pyproject.toml)
        run: mypy

  test:
    name: Full test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements/worker.lock
            requirements/dev.lock
      - name: Install the quantitative worker + dev dependencies from the locked, hash-verified sets
        run: |
          pip install --require-hashes -r requirements/worker.lock
          pip install --require-hashes -r requirements/dev.lock
          pip install -e . --no-deps
      - name: pytest (every test, including invariants and negative controls)
        run: pytest -v

  invariants:
    name: Statistical invariant lane (pytest -m invariants)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements/worker.lock
            requirements/dev.lock
      - name: Install the quantitative worker + dev dependencies from the locked, hash-verified sets
        run: |
          pip install --require-hashes -r requirements/worker.lock
          pip install --require-hashes -r requirements/dev.lock
          pip install -e . --no-deps
      # pytest exits 5 (ExitCode.NO_TESTS_COLLECTED) if -m matches nothing, and
      # --strict-markers (pyproject.toml addopts) fails collection outright on
      # a typo'd/unregistered marker name -- both make this job fail loudly if
      # the lane were ever accidentally emptied, with no extra step needed.
      - name: Run tests marked invariants (AGENTS.md's numbered statistical rules)
        run: pytest -m invariants -v

  negative-controls:
    name: Negative-control lane (pytest -m negative_controls)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements/worker.lock
            requirements/dev.lock
      - name: Install the quantitative worker + dev dependencies from the locked, hash-verified sets
        run: |
          pip install --require-hashes -r requirements/worker.lock
          pip install --require-hashes -r requirements/dev.lock
          pip install -e . --no-deps
      # Same guarantee as the invariants job above: pytest's own exit code 5
      # on an empty selection, plus --strict-markers, is what keeps this lane
      # honest -- no separate emptiness check needed.
      - name: Run tests marked negative_controls (a gate must be provably able to fail -- AGENTS.md invariant 14)
        run: pytest -m negative_controls -v

  control-plane-purity:
    name: Control-plane purity (no scientific stack in requirements/control.lock)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install pytest only -- this check reads requirements/control.lock as text
        run: pip install --require-hashes -r requirements/dev.lock
      - run: pytest tests/test_control_plane_purity.py tests/test_no_aws_in_core.py -v

  dependency-audit:
    name: Dependency audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install pip-audit from the locked, hash-verified set
        run: pip install --require-hashes -r requirements/dev.lock
      - name: Audit each lock independently (each ships in a different artifact)
        run: |
          pip-audit -r requirements/worker.lock --require-hashes
          pip-audit -r requirements/control.lock --require-hashes
          pip-audit -r requirements/dev.lock --require-hashes

  secret-scan:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: "8.30.1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks scans history; a shallow clone would miss it
      - name: Install gitleaks (pinned release, checksum-verified)
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -sSLO "${base}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSLO "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          sha256sum --ignore-missing -c "gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          tar -xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
      - name: gitleaks detect
        run: gitleaks detect --source . --no-banner --redact
